<script>
(function () {
  var form = document.getElementById('contact');
  var opener = document.getElementById('open-contact');
  var check = document.getElementById('human-check');
  var shown = document.getElementById('check-code');
  var error = document.getElementById('check-error');
  var box = document.getElementById('check-box');
  if (!form || !opener || !check || !shown || !box) return;

  var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 5; i++) code += alphabet[Math.floor(Math.random() * alphabet.length)];
  shown.textContent = code.split('').join(' ');
  box.hidden = false;
  check.required = true;

  function typed() { return check.value.replace(/\s+/g, '').toUpperCase(); }
  function good() { return typed() === code; }
  function syncReply() {
    var email = form.elements.email.value.trim();
    var reply = form.elements['_replyto'];
    if (!reply) {
      reply = document.createElement('input');
      reply.type = 'hidden';
      reply.name = '_replyto';
      form.appendChild(reply);
    }
    reply.value = email;
  }
  form.elements.email.addEventListener('input', syncReply);
  form.elements.email.addEventListener('change', syncReply);
  form.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') syncReply();
  });

  check.addEventListener('input', function () {
    var value = typed();
    var showError = value.length >= code.length && value !== code;
    error.hidden = !showError;
    if (showError) check.setAttribute('aria-invalid', 'true');
    else check.removeAttribute('aria-invalid');
  });

  opener.addEventListener('change', function () {
    if (!opener.checked) return;
    requestAnimationFrame(function () { form.elements.name.focus(); });
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && opener.checked) {
      opener.checked = false;
      opener.focus();
    }
  });

  form.addEventListener('submit', function (event) {
    ['name', 'email', 'message'].forEach(function (key) {
      form.elements[key].value = form.elements[key].value.trim();
    });
    var name = form.elements.name;
    var message = form.elements.message;
    if (!name.value || !message.value) {
      event.preventDefault();
      var empty = name.value ? message : name;
      empty.setCustomValidity('Please fill in this field.');
      empty.reportValidity();
      empty.addEventListener('input', function clear() {
        empty.setCustomValidity('');
        empty.removeEventListener('input', clear);
      });
      return;
    }
    if (!good()) {
      event.preventDefault();
      check.setAttribute('aria-invalid', 'true');
      error.hidden = false;
      check.focus();
      return;
    }
    syncReply();
  });
})();
</script>
